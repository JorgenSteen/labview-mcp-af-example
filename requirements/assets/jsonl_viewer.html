<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSONL viewer</title>
<!--
  Zuehlke MCP — viewer for output/<type>.jsonl written by ZM-CP-FL-file_logger.
  Each line is {"timestamp": "...", "type": "...", "data": {...}}. Drop a file on the page: every
  numeric field in "data" gets its own small chart (one y axis each; no dual axes), booleans are
  drawn as 0/1 steps, strings appear in the table. Self-contained, no external scripts. Open from disk.
-->
<style>
  :root {
    --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--ink-2); margin: 0 0 12px; }
  .drop { border: 2px dashed var(--axis); border-radius: 12px; padding: 18px; text-align: center; color: var(--ink-2); background: var(--surface); }
  .drop.over { border-color: var(--s1); }
  .drop input { margin-top: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
  .row button, .row label { border: 1px solid var(--grid); background: var(--surface); color: var(--ink); padding: 5px 10px; border-radius: 8px; font: inherit; cursor: pointer; }
  .row button[aria-pressed="true"] { border-color: var(--s1); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 14px; }
  .tile { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 8px 14px; min-width: 130px; }
  .tile .k { color: var(--ink-2); font-size: 12.5px; }
  .tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart { background: var(--surface); border: 1px solid var(--grid); border-radius: 12px; padding: 10px 12px 4px; margin: 10px 0; position: relative; }
  .chart h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chart h2 i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .chart .sub { color: var(--ink-2); font-size: 12.5px; margin: 0; }
  svg { width: 100%; height: 180px; display: block; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--surface); }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--ink-2); position: sticky; top: 0; background: var(--surface); }
  .tablewrap { max-height: 420px; overflow: auto; border: 1px solid var(--grid); border-radius: 10px; }
  .hidden { display: none; }
  .err { color: #d03b3b; }
</style>
</head>
<body>
<main>
  <h1>JSONL viewer</h1>
  <p class="lead">Open an <code>output/&lt;type&gt;.jsonl</code> file written by the Zuehlke MCP file logger. Every numeric field gets its own chart with its own axis; hover for values.</p>
  <div class="drop" id="drop">
    Drop a <code>.jsonl</code> file here, or
    <input type="file" id="file" accept=".jsonl,.json,.txt,.log">
    <div style="margin-top:8px"><button id="btnSample" style="border:1px solid var(--grid);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:8px;font:inherit;cursor:pointer">Load a synthetic sample</button></div>
  </div>
  <div class="row hidden" id="controls">
    <button id="btnCharts" aria-pressed="true">Charts</button>
    <button id="btnTable" aria-pressed="false">Table</button>
    <label><input type="checkbox" id="chkIndex"> x = sample index instead of time</label>
    <span id="fname" style="color: var(--ink-2)"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div id="charts"></div>
  <div id="table" class="hidden"></div>
  <p id="msg" class="err"></p>
</main>

<script>
(function () {
  const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
  const $ = id => document.getElementById(id);
  let rows = [], fields = [], useIndex = false, view = 'charts';

  // ---- loading -------------------------------------------------------------
  function load(file) {
    const rd = new FileReader();
    rd.onload = () => { parse(rd.result, file.name); };
    rd.readAsText(file);
  }
  function parse(text, name) {
    rows = []; let bad = 0;
    text.split(/\r?\n/).forEach((ln, i) => {
      ln = ln.trim(); if (!ln) return;
      try {
        const o = JSON.parse(ln);
        const t = Date.parse(o.timestamp);
        rows.push({ i: rows.length, line: i + 1, t: isNaN(t) ? null : t, type: o.type, data: (o.data && typeof o.data === 'object') ? o.data : {} , raw: o });
      } catch (e) { bad++; }
    });
    $('msg').textContent = bad ? `${bad} line(s) did not parse as JSON and were skipped.` : '';
    $('fname').textContent = `${name} — ${rows.length} rows`;
    $('controls').classList.remove('hidden');
    // field discovery: numeric / boolean / string, in first-seen order
    const seen = new Map();
    rows.forEach(r => Object.entries(r.data).forEach(([k, v]) => {
      const kind = typeof v === 'number' ? 'number' : typeof v === 'boolean' ? 'boolean' : 'string';
      if (!seen.has(k)) seen.set(k, kind); else if (seen.get(k) !== kind) seen.set(k, 'string');
    }));
    fields = [...seen.entries()].map(([k, kind]) => ({ k, kind }));
    render();
  }

  // ---- rendering -----------------------------------------------------------
  function fmtTime(t) { const d = new Date(t); return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0'); }
  function fmtNum(v) { return Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v)) : v.toFixed(2); }
  function niceTicks(min, max, n) {
    if (min === max) { min -= 1; max += 1; }
    const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
    for (let v = lo; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
    return { lo, hi, ticks: out };
  }

  function render() {
    renderStats(); renderCharts(); renderTable();
    $('charts').classList.toggle('hidden', view !== 'charts');
    $('table').classList.toggle('hidden', view !== 'table');
    $('btnCharts').setAttribute('aria-pressed', String(view === 'charts'));
    $('btnTable').setAttribute('aria-pressed', String(view === 'table'));
  }

  function renderStats() {
    const ts = rows.map(r => r.t).filter(t => t !== null);
    const span = ts.length > 1 ? (Math.max(...ts) - Math.min(...ts)) / 1000 : 0;
    const types = [...new Set(rows.map(r => r.type))].join(', ') || '—';
    const rate = span > 0 ? (rows.length - 1) / span : 0;
    $('stats').innerHTML = [
      ['rows', rows.length], ['type', types], ['duration', span ? span.toFixed(1) + ' s' : '—'], ['rate', rate ? rate.toFixed(2) + ' /s' : '—'],
      ['numeric fields', fields.filter(f => f.kind === 'number').length]
    ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  }

  function xOf(r) { return useIndex || r.t === null ? r.i : r.t; }

  function renderCharts() {
    const host = $('charts'); host.innerHTML = '';
    const plottable = fields.filter(f => f.kind === 'number' || f.kind === 'boolean');
    if (!rows.length) return;
    const xs = rows.map(xOf), xmin = Math.min(...xs), xmax = Math.max(...xs);
    plottable.forEach((f, idx) => {
      const color = `var(${SERIES[idx % SERIES.length]})`;
      const vals = rows.map(r => f.kind === 'boolean' ? (r.data[f.k] ? 1 : 0) : (typeof r.data[f.k] === 'number' ? r.data[f.k] : null));
      const present = vals.filter(v => v !== null);
      const yr = f.kind === 'boolean' ? { lo: 0, hi: 1, ticks: [0, 1] } : niceTicks(Math.min(...present), Math.max(...present), 4);
      const W = 1000, H = 180, L = 52, R = 14, T = 12, B = 26;
      const sx = x => L + (xmax === xmin ? 0.5 : (x - xmin) / (xmax - xmin)) * (W - L - R);
      const sy = y => T + (1 - (y - yr.lo) / (yr.hi - yr.lo || 1)) * (H - T - B);
      let d = '', pts = '';
      rows.forEach((r, i) => {
        if (vals[i] === null) return;
        const X = sx(xs[i]), Y = sy(vals[i]);
        if (f.kind === 'boolean' && d) { d += ` H${X.toFixed(1)}`; }
        d += (d ? ' L' : 'M') + `${X.toFixed(1)} ${Y.toFixed(1)}`;
        if (rows.length <= 400) pts += `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
      });
      const grid = yr.ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`).join('');
      const nx = 6, xt = [];
      for (let i = 0; i <= nx; i++) { const x = xmin + (xmax - xmin) * i / nx; xt.push(`<text x="${sx(x)}" y="${H - 8}" text-anchor="middle">${useIndex || rows[0].t === null ? Math.round(x) : fmtTime(x)}</text>`); }
      const stat = f.kind === 'boolean' ? `${present.filter(v => v === 1).length} true / ${present.length}` : `min ${fmtNum(Math.min(...present))} · max ${fmtNum(Math.max(...present))} · mean ${fmtNum(present.reduce((a, b) => a + b, 0) / present.length)}`;
      const div = document.createElement('div'); div.className = 'chart';
      div.innerHTML = `<h2><i style="background:${color}"></i>${f.k}</h2><p class="sub">${f.kind} · ${stat}</p>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}
          <line x1="${L}" x2="${W - R}" y1="${sy(yr.lo)}" y2="${sy(yr.lo)}" stroke="var(--axis)"/>${xt.join('')}
          <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${pts}
          <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/>
        </svg><div class="tip"></div>`;
      const svg = div.querySelector('svg'), cross = div.querySelector('.cross'), tip = div.querySelector('.tip');
      svg.addEventListener('mousemove', ev => {
        const rect = svg.getBoundingClientRect();
        const px = (ev.clientX - rect.left) / rect.width * W;
        let best = 0, bd = Infinity;
        xs.forEach((x, i) => { const dd = Math.abs(sx(x) - px); if (dd < bd) { bd = dd; best = i; } });
        const r = rows[best];
        cross.setAttribute('x1', sx(xs[best])); cross.setAttribute('x2', sx(xs[best])); cross.style.display = '';
        tip.style.display = 'block';
        tip.innerHTML = `<b>#${r.i}</b> ${r.t !== null ? fmtTime(r.t) : ''}<br>` + fields.map(g => `${g.k}: <b>${String(r.data[g.k])}</b>`).join('<br>');
        const tw = tip.offsetWidth, left = ev.clientX - rect.left + 14;
        tip.style.left = (left + tw > rect.width ? left - tw - 28 : left) + 'px';
        tip.style.top = (ev.clientY - rect.top - 10) + 'px';
      });
      svg.addEventListener('mouseleave', () => { cross.style.display = 'none'; tip.style.display = 'none'; });
      host.appendChild(div);
    });
    const strings = fields.filter(f => f.kind === 'string');
    if (strings.length) {
      const p = document.createElement('p'); p.style.color = 'var(--ink-2)';
      p.textContent = 'String fields (see the table): ' + strings.map(f => `${f.k} — ` + [...new Set(rows.map(r => r.data[f.k]))].slice(0, 8).join(', ')).join(' · ');
      host.appendChild(p);
    }
  }

  function renderTable() {
    const host = $('table');
    if (!rows.length) { host.innerHTML = ''; return; }
    const head = ['#', 'timestamp', 'type', ...fields.map(f => f.k)];
    const body = rows.map(r => `<tr><td>${r.i}</td><td>${r.raw.timestamp ?? ''}</td><td>${r.type ?? ''}</td>${fields.map(f => `<td>${r.data[f.k] === undefined ? '' : String(r.data[f.k])}</td>`).join('')}</tr>`).join('');
    host.innerHTML = `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  // ---- wiring --------------------------------------------------------------
  $('file').addEventListener('change', e => { if (e.target.files[0]) load(e.target.files[0]); });
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) load(f); });
  // synthetic sample: the exact line shape ZM-CP-FL-file_logger will write, 500 ms apart
  function sample() {
    const t0 = Date.now() - 10 * 500, statuses = ['ok', 'warm', 'cold'], lines = [];
    for (let i = 0; i < 20; i++) {
      const r = () => Math.random();
      lines.push(JSON.stringify({ timestamp: new Date(t0 + i * 500).toISOString(), type: 'TestPackage',
        data: { temperature_c: +(20 + 10 * r()).toFixed(3), sample_index: Math.floor(1000 * r()), duty_percent: Math.floor(101 * r()), sensor_ok: r() > 0.1, status: statuses[Math.floor(3 * r())] } }));
    }
    parse(lines.join('\n'), 'synthetic sample (20 rows)');
  }
  $('btnSample').addEventListener('click', sample);
  if (new URLSearchParams(location.search).get('sample') === '1') sample();
  $('btnCharts').addEventListener('click', () => { view = 'charts'; render(); });
  $('btnTable').addEventListener('click', () => { view = 'table'; render(); });
  $('chkIndex').addEventListener('change', e => { useIndex = e.target.checked; render(); });
})();
</script>
</body>
</html>
